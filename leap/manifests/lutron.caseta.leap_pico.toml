[driver]
id = "lutron.caseta.leap_pico"
name = "Lutron Pico Remote"
manufacturer = "Lutron"
version = "1.0.0"
runtime = "wasm"
# What this driver is worth hearing when nothing is wrong. Declaring it is also what lets an
# installer change it from the Logs page; a driver that declares nothing sits at `info` with
# no control. Everything it prints rather than logs is taken as `debug` and held to this too.
log_level = "info"
parent = "lutron.caseta.leap_bridge"

# One manifest for the whole Pico family, so this declares the largest of them — and it is a
# placeholder, not a description. A Pico2Button has two keys and a Pico3ButtonRaiseLower has
# five, and neither this file nor the bridge is what knows which: the bridge lists five buttons
# under a two-key remote and calls each of them `Button N`, so the *model* is the only thing
# that says which numbers are real and what they are engraved with. The driver holds that table
# and sends `key_count`/`key_labels` on the candidate, which replaces everything here at
# adoption. See `PICO_KEYS` and `pico_keys_of`. Without it a two-button remote arrived with five
# keys that were drawn, offered to automations, and impossible to press.
[[proxy]]
id = 1
type = "keypad"
primary = true
capabilities = { key_count = 5, key_labels = "Button 1,Button 2,Button 3,Button 4,Button 5" }

[[control]]
id = 1
kind = "network"
name = "LEAP"
port = 8081
tls = true
keepalive = true
# The bridge hangs up a client that says nothing — within minutes, confirmed on hardware. Core
# notices and dials again, but every press in the gap is gone, and presses are the entire point
# of holding this socket. So it is never idle: `/server/1/status/ping` answers `OnePingResponse`
# with the LEAP version and touches nothing. See `ControlDecl::heartbeat`.
heartbeat = '{"CommuniqueType":"ReadRequest","Header":{"Url":"/server/1/status/ping"}}'
heartbeat_secs = 60

# The remote's own href on the bridge — `/device/6`. Written by the bridge's setup flow at
# adoption, like the button hrefs below, and read back to ask `/device/<n>/status` for the
# battery. Declared rather than left implicit because it is the one property here that names the
# device itself rather than a key on it.
[[property]]
name = "Device href"
type = "string"
tooltip = "The remote's own href on the bridge — filled in automatically when adopted"

# No `[[property]]` blocks for the button hrefs. There were five of them — "Button 1 href"
# through "Button 5 href", identical but for a number spelled out in words — and they declared
# nothing: no default, not required, and the properties pane renders the keys a device actually
# has rather than the ones its manifest names. Every one is written by the bridge's setup flow
# at adoption, which is the only thing that can know a LEAP href, and read back by
# `pico_buttons` in the driver. That pair is the contract; a fifth copy of it here was five
# lines of comment pretending to be schema.
