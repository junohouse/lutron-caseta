[driver]
id = "lutron.caseta.leap_bridge"
name = "Lutron Caséta Smart Bridge"
manufacturer = "Lutron"
version = "1.0.0"
# The names in this package agree on `Lutron` alone — a Pico remote does not say Caséta — and
# the product is Caséta. `light` because that is what the system is for; the bridge is the wire.
product = "Lutron Caséta"
kind = "light"
runtime = "wasm"
# What this driver is worth hearing when nothing is wrong. Declaring it is also what lets an
# installer change it from the Logs page; a driver that declares nothing sits at `info` with
# no control. Everything it prints rather than logs is taken as `debug` and held to this too.
log_level = "info"

[[proxy]]
id = 1
type = "bridge"
primary = true
capabilities = { child_driver = "lutron.caseta.leap_dimmer", max_children = 0 }

[children]
proxies = ["light", "keypad"]

[[property]]
name = "Address"
type = "string"
tooltip = "IP of the Caséta Smart Bridge"

[[property]]
name = "Client certificate"
type = "password"
tooltip = "Issued by the bridge during pairing"

[[property]]
name = "Client key"
type = "password"
tooltip = "Issued by the bridge during pairing"

[[property]]
name = "CA certificate"
type = "password"
tooltip = "The bridge's own signing certificate, issued during pairing"

[discovery]
mdns = ["_lutron._tcp"]
mac_oui = ["C4:35:D9"]
