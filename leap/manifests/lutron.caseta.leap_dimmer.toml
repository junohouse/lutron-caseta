[driver]
id = "lutron.caseta.leap_dimmer"
name = "Lutron Caséta Dimmer"
manufacturer = "Lutron"
version = "1.0.0"
runtime = "wasm"
# What this driver is worth hearing when nothing is wrong. Declaring it is also what lets an
# installer change it from the Logs page; a driver that declares nothing sits at `info` with
# no control. Everything it prints rather than logs is taken as `debug` and held to this too.
log_level = "info"
parent = "lutron.caseta.leap_bridge"

[[proxy]]
id = 1
type = "light"
primary = true
capabilities = { dimmer = true, supports_ramp = true, ramp_rate_max_ms = 3600000, min_on_level = 1, max_on_level = 100 }

[[control]]
id = 1
kind = "network"
name = "LEAP"
port = 8081
tls = true
keepalive = true
# The bridge hangs up a client that says nothing — within minutes, confirmed on hardware. Core
# notices and dials again, but every press in the gap is gone, and presses are the entire point
# of holding this socket. So it is never idle: `/server/1/status/ping` answers `OnePingResponse`
# with the LEAP version and touches nothing. See `ControlDecl::heartbeat`.
heartbeat = '{"CommuniqueType":"ReadRequest","Header":{"Url":"/server/1/status/ping"}}'
heartbeat_secs = 60

[[property]]
name = "Device href"
type = "string"
tooltip = "The device's own href on the bridge — filled in automatically when adopted"

[[property]]
name = "Zone"
type = "string"
tooltip = "The device's zone href on the bridge — filled in automatically when adopted"

[[property]]
name = "Default fade"
type = "ranged_int"
min = 0
max = 60
default = 1
unit = "s"
tooltip = "Fade time used when a command does not specify one"
