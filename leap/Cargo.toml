[package]
name = "juno-driver-lutron-caseta-leap"
version = "1.0.0"
edition = "2024"
description = "Lutron Caséta Smart Bridge and its dimmers over LEAP"
publish = false

[lib]
name = "juno_driver_lutron_caseta_leap"
crate-type = ["cdylib", "rlib"]

[dependencies]
driver-sdk = { git = "https://github.com/junohouse/driver-sdk", branch = "main" }

# Pairing needs a keypair and a CSR to hand the bridge — nothing in std or the already-installed
# deps generates X.509, and rolling ASN.1 DER by hand for this is not a reasonable substitute.

# Working on core and this driver at once: point the SDK at a local checkout.
#   [patch."https://github.com/junohouse/driver-sdk"]
#   driver-sdk = { path = "../../../driver-sdk" }
